# Fly.io app for the PixelRAG search server (see deploy/pixelrag/README.md for the full deploy steps).
# Build context is the project root (this file's directory), because the Dockerfile COPYs
# data/hornsby/index_full and data/hornsby/pages from here.
#
# app name must be globally unique on Fly - change it if `fly deploy` reports it is taken.
app = "dcp-hornsby-search"
# Sydney: Fly auto-picked this region on the account's first deploy anyway, and it's the right
# call for this project's real users (Hornsby Council, NSW planners) - lower latency than a US
# region for them, worth the slightly higher per-hour rate.
primary_region = "syd"

[build]
	dockerfile = "deploy/pixelrag/Dockerfile"

[http_service]
	internal_port = 8080
	force_https = true
	auto_stop_machines = "stop"
	auto_start_machines = true
	min_machines_running = 0
	# a cold start takes ~25s (loading the model); give Fly time before it gives up on the
	# health check and recycles the machine
	[[http_service.checks]]
		grace_period = "45s"
		interval = "15s"
		timeout = "5s"
		method = "GET"
		path = "/health"

[[vm]]
	# Fly caps memory per shared-CPU tier at 2 GB * vCPU count (verified from a real deploy error:
	# shared-cpu-2x refused >4096 MiB). The search server needs 8.6 GB RSS measured live, so
	# shared-cpu-4x's 8192 MiB ceiling has no safety margin - shared-cpu-8x (ceiling 16384 MiB)
	# with 12 GB requested leaves headroom for the OS, Caddy and request bursts.
	size = "shared-cpu-8x"
	memory_mb = 12288
	# if flyctl rejects memory_mb in your version, deploy without it and instead run:
	#   fly scale memory 12288 -a dcp-hornsby-search
