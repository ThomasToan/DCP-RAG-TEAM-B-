services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dcp
    # Host port 5433: a local Postgres already owns 5432 on this machine.
    ports: ["5433:5432"]
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - dcp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d dcp"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  dcp_pgdata:
